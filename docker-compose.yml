services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
      - meilisearch
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://tlboard:${POSTGRES_PASSWORD}@postgres:5432/tlboard
      MEILI_HOST: http://meilisearch:7700
      ASSET_DIR: /data/assets
    volumes:
      - asset_data:/data/assets

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tlboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tlboard
    volumes:
      - postgres_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data

volumes:
  postgres_data:
  meili_data:
  asset_data:
